name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25                # a hung test must fail the job, not hold it for hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]                # Windows is not supported yet (see docs/INSTALL.md)
        python: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"            # a crash in Qt prints the Python stack, so the log names the test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - name: Find the crash (Python 3.10 aborts after test_glass_lists_insights.py)
        if: matrix.python == '3.10'
        continue-on-error: true
        run: |
          pip list 2>/dev/null | grep -i -E "pyside|shiboken"
          python -X faulthandler - <<'PY' || true
          from PySide6.QtGui import QPainter, QPixmap
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          pix = QPixmap(64, 64)
          p = QPainter(pix)
          print("probe: painter active", p.isActive(), flush=True)
          p.save()
          print("probe: save ok", flush=True)
          p.setRenderHint(QPainter.Antialiasing)
          print("probe: setRenderHint ok", flush=True)
          p.end()
          PY
          timeout -s KILL 150 pytest -s -x -v -o faulthandler_timeout=45 tests/test_grid_fills.py > grid.log 2>&1 || true
          grep -v "^  File \"/opt" grid.log | tail -60
      - run: pytest -v -o faulthandler_timeout=90      # a test stuck over 90 s dumps every thread's stack
      - name: Run the desktop-integration tests on a session bus (Linux)
        run: dbus-run-session -- pytest tests/test_mpris.py tests/test_singleton.py -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
