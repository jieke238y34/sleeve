name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # the build number counts commits
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag and work out the build number
        id: ver
        run: |
          v=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          case "${GITHUB_REF_NAME}" in
            "v$v") build=$(git rev-list --count HEAD) ;;
            "v$v-build."*) build="${GITHUB_REF_NAME##*-build.}" ;;
            *) echo "tag ${GITHUB_REF_NAME} does not match version $v (use v$v or v$v-build.N)"; exit 1 ;;
          esac
          case "$build" in ''|*[!0-9]*) echo "the build number is not a number: $build"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - run: pip install build
      - name: Stamp the build number into the package
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: python tools/stamp_build.py --build "$BUILD"
      - run: python -m build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Sleeve $VERSION (build $BUILD)" --generate-notes
